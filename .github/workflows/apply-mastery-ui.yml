name: Apply mastery progress UI

on:
  push:
    paths:
      - '.github/workflows/apply-mastery-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch mastery progress UI into index.html
        run: python3 .github/scripts/apply_mastery_ui.py
      - name: Commit patched app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Show mastery progress during and after quizzes"
          git push origin HEAD:main
