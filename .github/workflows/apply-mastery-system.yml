name: Apply mastery system

on:
  push:
    paths:
      - '.github/workflows/apply-mastery-system.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch mastery system into index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          anchor = "function weakness(id){let h=historyFor(id).sort((a,b)=>a.ts-b.ts);if(!h.length)return .8;let recent=h.slice(-5),r=recent.filter(x=>x.correct).length/recent.length;let consecutive=0;for(let i=h.length-1;i>=0&&h[i].correct;i--)consecutive++;let last=h[h.length-1]?.ts||0;let days=last?Math.min(14,(Date.now()-last)/86400000):14;return Math.max(.12,(1-r)*1.35+days*.025-Math.min(consecutive,4)*.08+(h.length<2?.2:0))}"
          mastery = r'''function masteryRule(diff){return diff==='A'?{attempts:5,accuracy:90,streak:3}:diff==='B'?{attempts:4,accuracy:80,streak:3}:{attempts:3,accuracy:67,streak:2}}
function masteryFor(id){const q=getQ(id),h=historyFor(id).sort((a,b)=>(a.ts||0)-(b.ts||0));if(!q)return{stage:'未定着',stageKey:'unlearned',attempts:0,accuracy:0,recent5Accuracy:0,currentCorrectStreak:0,graduated:false,rule:null};const attempts=h.length,correct=h.filter(a=>a.correct).length,accuracy=pct(correct,attempts),recent=h.slice(-5),recent5Accuracy=pct(recent.filter(a=>a.correct).length,recent.length);let currentCorrectStreak=0;for(let i=h.length-1;i>=0&&h[i].correct;i--)currentCorrectStreak++;const rule=masteryRule(q.diff);let stage='未定着',stageKey='unlearned';const graduated=attempts>=rule.attempts&&accuracy>=rule.accuracy&&currentCorrectStreak>=rule.streak;if(graduated){stage='卒業';stageKey='graduated'}else if(attempts>=Math.max(2,rule.attempts-1)&&accuracy>=Math.max(60,rule.accuracy-10)&&currentCorrectStreak>=Math.max(2,rule.streak-1)){stage='卒業候補';stageKey='candidate'}else if(attempts>=2&&(accuracy>=50||currentCorrectStreak>=1)){stage='定着中';stageKey='learning'}return{stage,stageKey,attempts,correct,wrong:attempts-correct,accuracy,recent5Accuracy,currentCorrectStreak,graduated,rule}}
function applyMasteryFor(id,{retroactive=false}={}){const q=getQ(id);if(!q)return null;const m=masteryFor(id);q.masteryStage=m.stageKey;q.masteryUpdatedAt=new Date().toISOString();if(m.graduated&&q.inactiveReason!=='manual'){if(q.active!==false||q.inactiveReason!=='graduated'){q.active=false;q.inactiveReason='graduated';q.graduatedAt=q.graduatedAt||new Date().toISOString();if(!retroactive)q.justGraduated=true}}return m}
function reconcileMastery(){let changed=false;for(const q of state.questions){const before=JSON.stringify([q.active,q.inactiveReason,q.graduatedAt,q.masteryStage]);applyMasteryFor(q.id,{retroactive:true});const after=JSON.stringify([q.active,q.inactiveReason,q.graduatedAt,q.masteryStage]);if(before!==after)changed=true}if(changed)save()}
'''
          if 'function masteryRule(diff)' not in s:
              if anchor not in s:
                  raise SystemExit('mastery insertion anchor not found')
              s = s.replace(anchor, anchor + mastery, 1)

          old_answer = "state.answers.push({qid:id,correct,date:today(),ts:Date.now()});if(mode==='today')"
          new_answer = "state.answers.push({qid:id,correct,date:today(),ts:Date.now()});const masteryNow=applyMasteryFor(id);if(mode==='today')"
          if old_answer in s:
              s = s.replace(old_answer, new_answer, 1)
          elif new_answer not in s:
              raise SystemExit('answer patch anchor not found')

          old_feedback = "<p>${esc(q.exp)}</p></div>${correct?'':`<div><p class=\"note\" style=\"margin-bottom:6px\">今回のミス理由</p>"
          new_feedback = "<p>${esc(q.exp)}</p>${masteryNow?.graduated&&q.justGraduated?'<p style=\"margin-top:10px;font-weight:800;color:#166534\">🎓 この問題は卒業しました。通常出題を自動でOFFにしました。</p>':''}</div>${correct?'':`<div><p class=\"note\" style=\"margin-bottom:6px\">今回のミス理由</p>"
          if old_feedback in s:
              s = s.replace(old_feedback, new_feedback, 1)

          old_next = "function nextQ(){idx++;answered=false;renderQuestion()}"
          new_next = "function nextQ(){const prev=getQ(session[idx]);if(prev)delete prev.justGraduated;idx++;answered=false;renderQuestion()}"
          if old_next in s:
              s = s.replace(old_next, new_next, 1)

          old_toggle = "function toggleActive(id){let q=getQ(id);q.active=q.active===false?true:false;save();renderManage()}"
          new_toggle = "function toggleActive(id){let q=getQ(id);if(q.active===false){q.active=true;q.inactiveReason=null;q.graduatedAt=null;q.masteryStage=masteryFor(id).stageKey}else{q.active=false;q.inactiveReason='manual'}save();renderManage()}"
          if old_toggle in s:
              s = s.replace(old_toggle, new_toggle, 1)
          elif new_toggle not in s:
              raise SystemExit('toggleActive patch anchor not found')

          old_save_editor = "if(id){Object.assign(getQ(id),data)}else state.questions.unshift({...data,id:uid(),favorite:false,createdAt:today()});save();closeModal();renderManage()}"
          new_save_editor = "if(id){const target=getQ(id),wasActive=target.active!==false;Object.assign(target,data);if(data.active){target.inactiveReason=null;if(!wasActive&&target.graduatedAt)target.graduatedAt=null}else target.inactiveReason='manual'}else state.questions.unshift({...data,id:uid(),favorite:false,createdAt:today(),inactiveReason:data.active?null:'manual'});save();closeModal();renderManage()}"
          if old_save_editor in s:
              s = s.replace(old_save_editor, new_save_editor, 1)

          old_perq = "return{id:q.id,category:q.cat,topic:q.topic,difficulty:q.diff,active:q.active!==false,favorite:!!q.favorite,question:q.q,attempts:h.length,correct:c,wrong:h.length-c,accuracy:pct(c,h.length),recent5Accuracy:pct(rc,recent.length),currentCorrectStreak:streak,lastAnsweredAt:h.length?(h[h.length-1].ts||null):null}"
          new_perq = "const m=masteryFor(q.id);return{id:q.id,category:q.cat,topic:q.topic,difficulty:q.diff,active:q.active!==false,inactiveReason:q.inactiveReason||null,favorite:!!q.favorite,question:q.q,attempts:h.length,correct:c,wrong:h.length-c,accuracy:pct(c,h.length),recent5Accuracy:pct(rc,recent.length),currentCorrectStreak:streak,lastAnsweredAt:h.length?(h[h.length-1].ts||null):null,masteryStage:m.stage,masteryStageKey:m.stageKey,graduated:m.graduated,graduatedAt:q.graduatedAt||null,graduationRule:m.rule}"
          if old_perq in s:
              s = s.replace(old_perq, new_perq, 1)
          elif new_perq not in s:
              raise SystemExit('perQuestion export patch anchor not found')

          old_data = "const data={format:'takken-chatgpt-analysis-quiz-v1',exportedAt:new Date().toISOString(),source:'通常一問一答',responseTimeAvailable:false,summary:{registeredQuestions:qs.length,activeQuestions:active.length,totalAttempts:ans.length,correct:ans.filter(a=>a.correct).length,wrong:ans.filter(a=>!a.correct).length,accuracy:pct(ans.filter(a=>a.correct).length,ans.length),streak:state.streak||0,lastStudy:state.lastStudy||null},byCategory:group(q=>q.cat),byTopic:group(q=>q.topic),byDifficulty:group(q=>q.diff),daily,mistakeReasons:state.mistakeReasons||{},perQuestion,history:ans.map(a=>({qid:a.qid,correct:!!a.correct,date:a.date||null,ts:a.ts||null}))};"
          new_data = "const masterySummary={unlearned:0,learning:0,candidate:0,graduated:0};for(const q of qs){const k=masteryFor(q.id).stageKey;if(Object.hasOwn(masterySummary,k))masterySummary[k]++}const data={format:'takken-chatgpt-analysis-quiz-v2',exportedAt:new Date().toISOString(),source:'通常一問一答',responseTimeAvailable:false,masteryPolicy:{A:{attempts:5,accuracy:90,streak:3},B:{attempts:4,accuracy:80,streak:3},C_D:{attempts:3,accuracy:67,streak:2},note:'卒業時は通常出題を自動OFF。手動OFFはinactiveReason=manualで区別。'},summary:{registeredQuestions:qs.length,activeQuestions:active.length,graduatedQuestions:masterySummary.graduated,totalAttempts:ans.length,correct:ans.filter(a=>a.correct).length,wrong:ans.filter(a=>!a.correct).length,accuracy:pct(ans.filter(a=>a.correct).length,ans.length),streak:state.streak||0,lastStudy:state.lastStudy||null},byMastery:masterySummary,byCategory:group(q=>q.cat),byTopic:group(q=>q.topic),byDifficulty:group(q=>q.diff),daily,mistakeReasons:state.mistakeReasons||{},perQuestion,history:ans.map(a=>({qid:a.qid,correct:!!a.correct,date:a.date||null,ts:a.ts||null}))};"
          if old_data in s:
              s = s.replace(old_data, new_data, 1)
          elif new_data not in s:
              raise SystemExit('analysis data patch anchor not found')

          old_card = "function problemCard(q){return`<div class=\"problem ${q.active===false?'inactive':''}\">"
          new_card = "function problemCard(q){const m=masteryFor(q.id);return`<div class=\"problem ${q.active===false?'inactive':''}\">"
          if old_card in s:
              s = s.replace(old_card, new_card, 1)

          old_chip = "${q.active===false?'<span class=\"chip off\">出題OFF</span>':''}</div>"
          new_chip = "<span class=\"chip ${m.stageKey==='graduated'?'okay':''}\">定着：${m.stage}</span>${q.active===false?`<span class=\"chip off\">${q.inactiveReason==='graduated'?'卒業・自動OFF':'出題OFF'}</span>`:''}</div>"
          if old_chip in s:
              s = s.replace(old_chip, new_chip, 1)

          old_init = "document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));renderHome();"
          new_init = "reconcileMastery();document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));renderHome();"
          if old_init in s:
              s = s.replace(old_init, new_init, 1)
          elif new_init not in s:
              raise SystemExit('startup patch anchor not found')

          p.write_text(s, encoding='utf-8')
          print('mastery system patched')
          PY
      - name: Commit patched app
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Implement mastery stages and automatic graduation"
          git push origin HEAD:main
