name: Apply borrowed-land-house drill
on:
  push:
    paths:
      - 'scripts/apply-shakuchi-drill.py'
      - '.github/workflows/apply-shakuchi-drill.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply drill update
        run: python scripts/apply-shakuchi-drill.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*)</script>',s)
          assert m, 'script tag not found'
          Path('/tmp/app.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Check drill markers
        run: |
          grep -q '>ドリル</button>' index.html
          grep -q '借地借家法ドリル' index.html
          grep -q 'shaku-0024' index.html
          grep -q 'render3537Landing' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add drill hub and borrowed-land-house drill"
          git push
