function weakness(qi){let h=historyFor(qi); if(!h.length)return .55; let r=h.filter(x=>x.correct).length/h.length; return 1-r+Math.min(h.length,4)*.04}
function pickWeighted(n,filter=()=>true){
 let pool=QUESTIONS.map((q,qi)=>({q,qi,w:Math.max(.15,weakness(qi))})).filter(x=>filter(x.q,x.qi)); let out=[];
 while(pool.length&&out.length<n){let sum=pool.reduce((s,x)=>s+x.w,0),r=Math.random()*sum,chosen=0;for(let i=0;i<pool.length;i++){r-=pool[i].w;if(r<=0){chosen=i;break}}out.push(pool.splice(chosen,1)[0].qi)}
 return out;
}
function show(view){['home','quiz','weak','stats','sort'].forEach(v=>$('#'+v+'View').classList.toggle('hidden',v!==view));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='home')renderHome();if(view==='weak')renderWeak();if(view==='stats')renderStats();if(view==='sort')renderSortLanding();if(view==='quiz'&&!session.length)renderQuizLanding();}
function weakItems(limit=4){return topicStats().map(x=>({...x,r:x.t?Math.round(x.c/x.t*100):null})).sort((a,b)=>(a.r??55)-(b.r??55)||b.t-a.t).slice(0,limit)}
function renderHome(){
 const td=state.todayDone.date===today()?state.todayDone.count:0; $('#streakPill').textContent=`🔥 ${state.streak}日`;
 const ws=weakItems(3);
 $('#homeView').innerHTML=`
 <section class="card hero"><small>今日の復習</small><h2>${td} / 10問</h2><p>苦手なテーマを優先して自動出題します。</p><div class="progress"><i style="width:${Math.min(td,10)*10}%"></i></div><button class="primary" onclick="startMode('today')">${td>=10?'もう10問やる':'今日の10問を始める'}</button></section>
 <div class="grid"><div class="card mini"><b>${score()}%</b><span>総合正答率</span></div><div class="card mini"><b>${state.answers.length}</b><span>累計回答数</span></div></div>
 <div class="section-title"><h3>いま優先したいテーマ</h3><small>弱点順</small></div>
 <section class="card weak-list">${ws.map(w=>`<div class="weak"><div><div class="name">${w.topic}</div><div class="meta">${w.cat}・${w.t?`${w.t}問回答`:'未学習'}</div></div><span class="badge ${w.r===null||w.r<60?'red':w.r<80?'orange':'green'}">${w.r===null?'要確認':w.r+'%'}</span></div>`).join('')}</section>
 <div class="section-title"><h3>学習モード</h3></div>
 <div class="mode-row"><button class="mode" onclick="startMode('weak')"><b>🎯 苦手特訓</b><span>弱い問題を優先</span></button><button class="mode" onclick="startMode('mistakes')"><b>❌ ミス問題</b><span>間違いだけ復習</span></button><button class="mode" onclick="startMode('random')"><b>🎲 ランダム10</b><span>全範囲から出題</span></button><button class="mode" onclick="show('stats')"><b>📊 成績を見る</b><span>分野別に確認</span></button></div>`;
}
function renderQuizLanding(){
 $('#quizView').innerHTML=`<section class="card"><h2 style="margin-top:0">一問一答</h2><p class="note">モードを選ぶと、○×形式で10問出題します。</p><div class="mode-row" style="margin-top:16px"><button class="mode" onclick="startMode('today')"><b>☀️ 今日の10問</b><span>弱点優先</span></button><button class="mode" onclick="startMode('weak')"><b>🎯 苦手特訓</b><span>弱点を集中</span></button><button class="mode" onclick="startMode('mistakes')"><b>❌ ミス問題</b><span>誤答から出題</span></button><button class="mode" onclick="startMode('random')"><b>🎲 ランダム</b><span>全分野</span></button></div></section>`;
}
function startMode(m){mode=m; touchStudy(); if(m==='mistakes'){let bad=[...new Set(state.answers.filter(x=>!x.correct).map(x=>x.qi))];session=bad.length?bad.sort(()=>Math.random()-.5).slice(0,10):pickWeighted(10)} else if(m==='random') session=QUESTIONS.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,10); else session=pickWeighted(10);idx=0;answered=false;show('quiz');renderQuestion();}
function renderQuestion(){
 if(idx>=session.length){renderFinish();return}
 const qi=session[idx],q=QUESTIONS[qi],h=historyFor(qi),r=h.length?Math.round(h.filter(x=>x.correct).length/h.length*100):null;
 $('#quizView').innerHTML=`<section class="card"><div class="quiz-head"><span>${idx+1} / ${session.length}</span><span>${mode==='today'?'今日の10問':mode==='weak'?'苦手特訓':mode==='mistakes'?'ミス問題':'ランダム'}</span></div><span class="qtag">${q.cat} ・ ${q.topic} ・ 難易度${q.diff}</span><div class="question">${q.q}</div><div class="answer-grid"><button id="yes" class="answer" onclick="answer(true)">○</button><button id="no" class="answer" onclick="answer(false)">×</button></div><div id="feedback"></div>${r===null?'':`<p class="note" style="margin-top:14px">このテーマのあなたの正答率：${r}%</p>`}</section>`;
}
function answer(val){if(answered)return;answered=true;const qi=session[idx],q=QUESTIONS[qi],correct=val===q.a;state.answers.push({qi,correct,date:today(),ts:Date.now()});if(mode==='today'){if(state.todayDone.date!==today())state.todayDone={date:today(),count:0};state.todayDone.count++}save();$('#yes').classList.add(q.a?'ok':'ng');$('#no').classList.add(!q.a?'ok':'ng');const f=$('#feedback');f.innerHTML=`<div class="result ${correct?'good':'bad'}"><h4>${correct?'✅ 正解':'❌ 不正解'}　正解：${q.a?'○':'×'}</h4><p>${q.exp}</p></div>${correct?'':`<div><p class="note" style="margin-bottom:6px">今回のミス理由</p><div class="reasons">${['知識不足','数字を忘れた','勘違い','読み間違い','迷って変えた'].map(x=>`<button class="reason" onclick="setReason(this,'${x}',${qi})">${x}</button>`).join('')}</div></div>`}<button class="primary" style="margin-top:12px" onclick="nextQ()">${idx+1===session.length?'結果を見る':'次の問題'}</button>`;}
function setReason(el,reason,qi){document.querySelectorAll('.reason').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');state.mistakeReasons[reason]=(state.mistakeReasons[reason]||0)+1;save();}
function nextQ(){idx++;answered=false;renderQuestion()}
function renderFinish(){let recent=state.answers.slice(-session.length),c=recent.filter(x=>x.correct).length;$('#quizView').innerHTML=`<section class="card" style="text-align:center"><div style="font-size:54px">${c>=8?'🎉':c>=6?'👍':'🧠'}</div><h2>${c} / ${session.length} 正解</h2><p class="note">${c>=8?'かなり安定しています。':'間違えたテーマは弱点リストに反映しました。'}</p><button class="primary" onclick="startMode('${mode}')">もう一度</button><button class="secondary" style="margin-top:10px" onclick="show('home')">ホームへ</button></section>`;session=[];renderHome();}
function renderWeak(){let ws=topicStats().map(x=>({...x,r:x.t?Math.round(x.c/x.t*100):null})).sort((a,b)=>(a.r??55)-(b.r??55)||b.t-a.t);$('#weakView').innerHTML=`<div class="section-title"><h3>弱点ランキング</h3><small>正答率の低い順</small></div><section class="card weak-list">${ws.map(w=>`<div class="weak"><div><div class="name">${w.topic}</div><div class="meta">${w.cat} ・ ${w.t?`${w.c}/${w.t}正解`:'まだ回答なし'}</div></div><span class="badge ${w.r===null||w.r<60?'red':w.r<80?'orange':'green'}">${w.r===null?'未学習':w.r+'%'}</span></div>`).join('')}</section><button class="primary" onclick="startMode('weak')">苦手特訓を始める</button>`;}
function renderStats(){const cats=['権利関係','宅建業法','法令上の制限','税・その他'];const html=cats.map(cat=>{let qis=QUESTIONS.map((q,i)=>q.cat===cat?i:null).filter(x=>x!==null),ans=state.answers.filter(a=>qis.includes(a.qi)),c=ans.filter(a=>a.correct).length,r=ans.length?Math.round(c/ans.length*100):0;return `<div class="stat-row"><div class="line"><b>${cat}</b><span>${ans.length?`${c}/${ans.length}（${r}%）`:'未回答'}</span></div><div class="bar"><i style="width:${r}%"></i></div></div>`}).join('');let reasons=Object.entries(state.mistakeReasons).sort((a,b)=>b[1]-a[1]);$('#statsView').innerHTML=`<section class="card"><h2 style="margin-top:0">成績</h2><div class="grid"><div class="mini"><b>${score()}%</b><span>総合正答率</span></div><div class="mini"><b>${state.answers.length}</b><span>累計回答数</span></div></div>${html}</section><section class="card"><h3 style="margin-top:0">ミスの原因</h3>${reasons.length?reasons.map(([k,v])=>`<div class="weak"><span class="name">${k}</span><b>${v}回</b></div>`).join(''):'<div class="empty">まだミス理由の記録がありません。</div>'}</section><section class="card"><h3 style="margin-top:0">データ管理</h3><p class="note">この試作版は、この端末のブラウザ内に学習履歴を保存します。</p><button class="secondary danger" onclick="resetData()">学習履歴をリセット</button></section>`;}

function sortBank(){try{const x=JSON.parse(localStorage.getItem(SORT_BANK_KEY)||'null');return x&&Array.isArray(x.questions)?x:null}catch(e){return null}}
function setSortBank(x){localStorage.setItem(SORT_BANK_KEY,JSON.stringify(x))}
function sortStats(){try{return JSON.parse(localStorage.getItem(SORT_STATS_KEY)||'{}')}catch(e){return {}}}
function setSortStats(x){localStorage.setItem(SORT_STATS_KEY,JSON.stringify(x))}
function initSortBank(){let b=sortBank();if(!b){b=JSON.parse(JSON.stringify(SORT_SEED));setSortBank(b)}return b}
function sortSignature(q){return JSON.stringify({answer:q.answer,objectType:q.objectType,transactionType:q.transactionType,conditions:q.conditions||{}})}
function validateSortBank(data){if(!data||data.format!=='takken-3537-sort-drill-v1'||!Array.isArray(data.questions))throw new Error('35・37条仕分けドリル用のJSONではありません。');const ids=new Set();for(const q of data.questions){if(!q||typeof q.id!=='string'||!q.id.trim())throw new Error('IDのない問題があります。');if(ids.has(q.id))throw new Error(`JSON内でIDが重複しています: ${q.id}`);ids.add(q.id);if(!Object.hasOwn(SORT_LABELS,q.answer))throw new Error(`正解分類が不正です: ${q.id}`);if(!q.prompt||!q.objectType||!q.transactionType)throw new Error(`必須項目が不足しています: ${q.id}`)}return true}
function mergeSortBank(incoming){validateSortBank(incoming);const current=initSortBank(),map=new Map((current.questions||[]).map(q=>[q.id,q])),stats=sortStats();let added=0,updated=0,skippedOld=0,resetStats=0,unchanged=0;for(const q of incoming.questions){const old=map.get(q.id);if(!old){map.set(q.id,q);added++;continue}const ov=Number(old.version??1),nv=Number(q.version??1);if(nv<ov){skippedOld++;continue}if(JSON.stringify(old)===JSON.stringify(q)){unchanged++;continue}if(sortSignature(old)!==sortSignature(q)&&stats[q.id]){delete stats[q.id];resetStats++}map.set(q.id,q);updated++}current.questions=[...map.values()].sort((a,b)=>String(a.id).localeCompare(String(b.id)));current.lawBaseDate=incoming.lawBaseDate||current.lawBaseDate;current.examYear=incoming.examYear||current.examYear;current.answerLabels=incoming.answerLabels||current.answerLabels;current.sourcePolicy=incoming.sourcePolicy||current.sourcePolicy;setSortBank(current);setSortStats(stats);return{added,updated,skippedOld,resetStats,unchanged,total:current.questions.length}}
function sortQuestions(){return (initSortBank().questions||[]).filter(q=>q.active!==false)}
function sortShuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sortStatusText(){const qs=sortQuestions(),st=sortStats(),done=qs.filter(q=>(st[q.id]?.attempts||0)>0).length,bad=qs.filter(q=>(st[q.id]?.wrong||0)>0).length;return `${qs.length}問・学習済 ${done}問・誤答あり ${bad}問`}
function renderSortLanding(){initSortBank();const v=$('#sortView');v.innerHTML=`<section class="card"><h2 style="margin-top:0">35条・37条 仕分けドリル</h2><p class="note">目的物と取引類型まで見て、「35条のみ・37条のみ・両方・どちらでもない」を瞬時に仕分けます。</p><div class="pill" style="display:inline-block;margin-top:6px">${sortStatusText()}</div><div class="sort-controls"><label class="note">出題モード<select id="sortMode" class="sort-select"><option value="all">全項目</option><option value="wrong">間違えた項目だけ</option></select></label><label class="note">出題数<select id="sortCount" class="sort-select"><option value="10">10問</option><option value="20">20問</option><option value="all">全問</option></select></label><label class="note">目的物<select id="sortObject" class="sort-select"><option value="all">すべて</option><option value="土地">土地</option><option value="建物">建物</option></select></label><label class="note">取引<select id="sortTransaction" class="sort-select"><option value="all">すべて</option><option value="売買・交換">売買・交換</option><option value="貸借">貸借</option></select></label></div><button class="primary" style="margin-top:12px" onclick="startSortDrill()">仕分けドリルを開始</button></section><section class="card"><h3 style="margin-top:0">問題データ管理</h3><p class="note">ChatGPTで修正したJSONを読み込むと、同じIDの問題を更新します。古いversionは上書きしません。正答や取引条件が変わった問題だけ、その問題の学習統計をリセットします。</p><input id="sortImport" class="sort-file" type="file" accept="application/json,.json" onchange="importSortFile(this.files[0])"><div id="sortImportStatus" class="note" style="margin-top:8px">初期問題45問を内蔵しています。</div><button class="secondary" style="margin-top:10px" onclick="exportSortBank()">現在の問題JSONを書き出す</button><button class="secondary danger" style="margin-top:10px" onclick="resetSortStats()">仕分け学習履歴をリセット</button><div class="sort-bank-list">${sortQuestions().map(q=>`<div class="sort-bank-row"><div><span class="sort-id">${q.id} / v${q.version??1}</span></div><b>${q.prompt}</b><div class="note">${q.objectType}・${q.transactionType} → ${SORT_LABELS[q.answer]}</div></div>`).join('')}</div></section>`}
function startSortDrill(){let qs=sortQuestions(),st=sortStats(),m=$('#sortMode').value,obj=$('#sortObject').value,tr=$('#sortTransaction').value;if(m==='wrong')qs=qs.filter(q=>(st[q.id]?.wrong||0)>0);if(obj!=='all')qs=qs.filter(q=>q.objectType===obj);if(tr!=='all')qs=qs.filter(q=>q.transactionType===tr);qs=sortShuffle(qs);const cnt=$('#sortCount').value,n=cnt==='all'?qs.length:Math.min(Number(cnt),qs.length);qs=qs.slice(0,n);if(!qs.length){$('#sortView').innerHTML=`<section class="card"><div class="empty">条件に合う問題がありません。</div><button class="secondary" onclick="renderSortLanding()">条件選択に戻る</button></section>`;return}sortSession={ids:qs.map(q=>q.id),idx:0,correct:0,answered:false,answers:[],started:Date.now()};renderSortQuestion()}
function currentSortQ(){if(!sortSession)return null;const id=sortSession.ids[sortSession.idx];return sortQuestions().find(q=>q.id===id)||null}
function sortCondLabel(k,v){const m={existing:'既存建物',residential:'住宅',construction:'工事',hasProvision:'定めあり',asbestosRecord:'石綿調査記録あり',oldBuilding:'旧耐震対象',seismicRecord:'耐震診断あり',newHousing:'新築住宅',housingPerformanceEvaluation:'住宅性能評価あり'};if(v===true)return m[k]||k;if(k==='construction')return `工事：${v}`;return `${m[k]||k}：${v}`}
function renderSortQuestion(){const q=currentSortQ();if(!q){renderSortFinish();return}sortSession.answered=false;sortSession.qStarted=Date.now();const i=sortSession.idx,total=sortSession.ids.length,st=sortStats()[q.id]||{},conds=Object.entries(q.conditions||{}).filter(([,v])=>v!==false&&v!==null&&v!=='').map(([k,v])=>`<span class="sort-chip">${sortCondLabel(k,v)}</span>`).join('');$('#sortView').innerHTML=`<section class="card"><div class="quiz-head"><span>${i+1} / ${total}</span><span>${sortSession.correct}正解</span></div><div class="sort-progress"><i style="width:${Math.round(i/total*100)}%"></i></div><div class="sort-meta"><span class="sort-chip">目的物：${q.objectType}</span><span class="sort-chip">取引：${q.transactionType}</span>${conds}</div><div class="sort-question">${q.prompt}</div><div class="sort-answers">${Object.entries(SORT_LABELS).map(([v,l])=>`<button class="sort-answer" data-sort-answer="${v}" onclick="answerSort('${v}')">${l}</button>`).join('')}</div><div id="sortFeedback"></div><p class="note" style="margin-top:14px">ID ${q.id} / v${q.version??1} ・ 過去 ${st.correct||0}正解 / ${st.wrong||0}誤答</p></section>`}
function answerSort(val){if(!sortSession||sortSession.answered)return;const q=currentSortQ();sortSession.answered=true;const ok=val===q.answer,ms=Date.now()-sortSession.qStarted;if(ok)sortSession.correct++;sortSession.answers.push({id:q.id,correct:ok,ms});const all=sortStats(),s=all[q.id]||{attempts:0,correct:0,wrong:0,totalMs:0,lastAnswer:null,lastAt:null};s.attempts++;s[ok?'correct':'wrong']++;s.totalMs=(s.totalMs||0)+ms;s.lastAnswer=val;s.lastAt=new Date().toISOString();s.version=q.version??1;all[q.id]=s;setSortStats(all);document.querySelectorAll('.sort-answer').forEach(b=>{b.disabled=true;if(b.dataset.sortAnswer===q.answer)b.classList.add('ok');if(b.dataset.sortAnswer===val&&!ok)b.classList.add('ng');if(b.dataset.sortAnswer===val)b.classList.add('sel')});const f=$('#sortFeedback');f.className=`sort-feedback ${ok?'good':'bad'}`;f.innerHTML=`<h4 style="margin:0">${ok?'✅ 正解':'❌ 不正解'}　正解：${SORT_LABELS[q.answer]}</h4><p>${q.explanation||''}</p><div class="note">根拠：${q.legalBasis||'-'}　回答時間：${(ms/1000).toFixed(1)}秒</div><button class="primary" style="margin-top:12px" onclick="nextSortQ()">${sortSession.idx+1===sortSession.ids.length?'結果を見る':'次の問題'}</button>`}
function nextSortQ(){sortSession.idx++;if(sortSession.idx>=sortSession.ids.length)renderSortFinish();else renderSortQuestion()}
function renderSortFinish(){const total=sortSession.ids.length,c=sortSession.correct,p=Math.round(c/total*100),avg=sortSession.answers.reduce((a,x)=>a+x.ms,0)/sortSession.answers.length/1000,miss=sortSession.answers.filter(x=>!x.correct);$('#sortView').innerHTML=`<section class="card" style="text-align:center"><div style="font-size:52px">${p>=90?'🎯':p>=70?'👍':'🗂️'}</div><h2>${c} / ${total} 正解</h2><p class="note">正答率 ${p}% ・ 平均回答 ${avg.toFixed(1)}秒</p>${miss.length?`<div style="text-align:left;margin:14px 0">${miss.map(x=>{const q=sortQuestions().find(q=>q.id===x.id);return `<div class="weak"><div><div class="sort-id">${x.id}</div><div class="name">${q?.prompt||''}</div></div></div>`}).join('')}</div>`:'<p class="note">全問正解です。</p>'}<button class="primary" onclick="renderSortLanding()">条件選択に戻る</button></section>`;sortSession=null}
async function importSortFile(file){if(!file)return;try{const data=JSON.parse(await file.text()),r=mergeSortBank(data);renderSortLanding();const el=$('#sortImportStatus');if(el){el.textContent=`更新完了：追加 ${r.added}問 / 更新 ${r.updated}問 / 変更なし ${r.unchanged}問 / 古いversion無視 ${r.skippedOld}問 / 統計リセット ${r.resetStats}問 / 合計 ${r.total}問`;el.style.color='var(--good)'}}catch(e){const el=$('#sortImportStatus');if(el){el.textContent=`読み込み失敗：${e.message}`;el.style.color='var(--bad)'}}}
function exportSortBank(){const b=initSortBank(),blob=new Blob([JSON.stringify(b,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`takken_3537_sort_drill_${b.examYear||'bank'}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}
function resetSortStats(){if(confirm('35・37条仕分けドリルの学習履歴をリセットしますか？\n問題データは残ります。')){localStorage.removeItem(SORT_STATS_KEY);sortSession=null;renderSortLanding()}}

function resetData(){if(confirm('学習履歴をすべて削除しますか？')){localStorage.removeItem(KEY);state={answers:[],streak:0,lastStudy:null,todayDone:{date:'',count:0},mistakeReasons:{}};session=[];renderHome();renderStats();}}
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));
initSortBank();
renderHome();
</script>
</body>
