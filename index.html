blem-meta{font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}.chip{border-radius:999px;padding:4px 7px;background:#f1f5f9}.chip.ai{background:#fef3c7;color:#92400e}.chip.okay{background:#dcfce7;color:#166534}.chip.off{background:#fee2e2;color:#991b1b}.iconbtn{border:0;background:#f8fafc;border-radius:10px;padding:7px;cursor:pointer;font-size:16px}.toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.toggle input{width:18px;height:18px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.48);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:12px}.sheet{background:#fff;border-radius:24px 24px 16px 16px;width:min(100%,560px);max-height:92vh;overflow:auto;padding:18px}.sheet h2{margin-top:0}.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.import-summary{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:13px;line-height:1.7}.countbox{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.countbox div{background:#f8fafc;border-radius:12px;padding:10px;text-align:center}.countbox b{display:block;font-size:18px}.countbox span{font-size:10px;color:var(--muted)}.fav{color:#f59e0b}.clickable{cursor:pointer}

<script>
const DEFAULT_QUESTIONS=[{cat:'権利関係',topic:'制限行為能力者',diff:'A',q:'未成年者が法定代理人の同意を得ずにした契約は、原則として取り消すことができる。',a:true,exp:'未成年者が単独で行った法律行為は、原則として取り消すことができます。例外として、単に権利を得る・義務を免れる行為などがあります。'},{cat:'権利関係',topic:'意思表示',diff:'A',q:'心裡留保による意思表示は、相手方が表意者の真意でないことを知っていた場合でも有効である。',a:false,exp:'相手方が表意者の真意でないことを知り、または知ることができたとき、その意思表示は無効です。'},{cat:'権利関係',topic:'無権代理',diff:'B',q:'本人が無権代理行為を追認した場合、その効力は原則として追認時から生じる。',a:false,exp:'追認は、原則として契約時にさかのぼって効力を生じます。ただし第三者の権利を害することはできません。'},{cat:'権利関係',topic:'時効',diff:'B',q:'消滅時効は、当事者が援用しなくても裁判所が職権で適用できる。',a:false,exp:'時効は、当事者が援用しなければ裁判所が職権で適用することはできません。'},{cat:'権利関係',topic:'抵当権',diff:'B',q:'抵当権は、目的物を債権者に引き渡さなくても設定できる。',a:true,exp:'抵当権は非占有担保なので、目的物の占有を設定者に残したまま設定できます。'},{cat:'権利関係',topic:'相続',diff:'A',q:'配偶者は、常に相続人となる。',a:true,exp:'配偶者は常に相続人です。子、直系尊属、兄弟姉妹が順位に応じて配偶者と共同相続人になります。'},{cat:'権利関係',topic:'賃貸借',diff:'B',q:'賃貸人が賃貸物を第三者に譲渡した場合、賃貸人の地位は必ず譲受人に移転する。',a:false,exp:'「必ず」ではありません。対抗要件や当事者間の合意など、具体的条件により扱いが変わります。'},{cat:'権利関係',topic:'借地借家法',diff:'B',q:'建物賃貸借では、期間を1年未満と定めた場合、原則として期間の定めのない賃貸借とみなされる。',a:true,exp:'借地借家法上、建物賃貸借で1年未満の期間を定めた場合は、期間の定めのない賃貸借とみなされます。'},{cat:'宅建業法',topic:'免許',diff:'A',q:'宅建業者が複数の都道府県に事務所を設置する場合、国土交通大臣の免許が必要である。',a:true,exp:'2以上の都道府県の区域内に事務所を設置する場合は国土交通大臣免許です。1都道府県内のみなら都道府県知事免許です。'},{cat:'宅建業法',topic:'宅地建物取引士',diff:'A',q:'専任の宅地建物取引士は、原則として1つの事務所に常勤しなければならない。',a:true,exp:'専任性には常勤性・専従性が求められます。'},{cat:'宅建業法',topic:'35条書面',diff:'A',q:'重要事項説明は、宅地建物取引士が行わなければならない。',a:true,exp:'35条の重要事項説明は宅地建物取引士が行います。'},{cat:'宅建業法',topic:'37条書面',diff:'A',q:'37条書面は、必ず宅地建物取引士が説明しなければならない。',a:false,exp:'37条書面への記名は宅建士が行いますが、35条のような「宅建士による説明義務」はありません。'},{cat:'宅建業法',topic:'8種制限',diff:'B',q:'宅建業者が自ら売主となり、宅建業者でない者が買主の場合、手付金等の保全措置が必要となることがある。',a:true,exp:'宅建業者自ら売主・買主が非業者の場合、一定額を超える手付金等には保全措置が必要です。'},{cat:'宅建業法',topic:'報酬額',diff:'B',q:'宅建業者は、依頼者が承諾すれば国土交通大臣が定める上限を超える報酬を受け取ることができる。',a:false,exp:'依頼者の承諾があっても、法定の報酬上限を超えて受領することはできません。'},{cat:'宅建業法',topic:'クーリング・オフ',diff:'B',q:'事務所以外の場所で買受けの申込みをした買主は、一定の場合にクーリング・オフができる。',a:true,exp:'宅建業者が売主で買主が非業者の場合、事務所以外など一定の場 const KEY='takkenWeakMVP_v2',OLD_KEY='takkenWeakMVP_v1';const $=s=>document.querySelector(s);const today=()=>new Date().toLocaleDateString('sv-SE');const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const uid=()=> 'q_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);const norm=s=>String(s||'').replace(/\s+/g,'').replace(/[。、，．,.「」『』（）()]/g,'').toLowerCase();function defaultBank(){return DEFAULT_QUESTIONS.map((q,i)=>({...q,id:'seed_'+String(i+1).padStart(3,'0'),source:'初期問題',verified:true,active:true,favorite:false,createdAt:'2026-09-08'}))}function freshState(){return{version:2,questions:defaultBank(),answers:[],streak:0,lastStudy:null,todayDone:{date:'',count:0},mistakeReasons:{},quizCount:10}}function loadState(){let s=JSON.parse(localStorage.getItem(KEY)||'null');if(s?.version===2&&Array.isArray(s.questions)){if(s.quizCount==null)s.quizCount=10;return s}let old=JSON.parse(localStorage.getItem(OLD_KEY)||'null'),n=freshState();if(old){n.streak=old.streak||0;n.lastStudy=old.lastStudy||null;n.todayDone=old.todayDone||{date:'',count:0};n.mistakeReasons=old.mistakeReasons||{};n.answers=(old.answers||[]).map(a=>({...a,qid:n.questions[a.qi]?.id})).filter(a=>a.qid).map(({qi,...a})=>a)}return n}let state=loadState(),session=[],idx=0,answered=false,mode='today',pendingMode=null,pendingTopic='',sessionStartAnswerCount=0,manageFilter={q:'',cat:'all',status:'all'};const save=()=>localStorage.setItem(KEY,JSON.stringify(state));save();const getQ=id=>state.questions.find(q=>q.id===id);const activeQs=()=>state.questions.filter(q=>q.active!==false);function touchStudy(){const d=today();if(state.lastStudy!==d){let y=new Date();y.setDate(y.getDate()-1);let yd=y.toLocaleDateString('sv-SE');state.streak=state.lastStudy===yd?state.streak+1:1;state.lastStudy=d}if(state.todayDone.date!==d)state.todayDone={date:d,count:0};save()}function historyFor(id){return state.answers.filter(x=>x.qid===id)}function score(){let t=state.answers.length,c=state.answers.filter(x=>x.correct).length;return t?Math.round(c/t*100):0}function topicStats(){const map={};activeQs().forEach(q=>{if(!map[q.topic])map[q.topic]={topic:q.topic,cat:q.cat,c:0,t:0,last:null};historyFor(q.id).forEach(a=>{map[q.topic].t++;if(a.correct)map[q.topic].c++;if(!map[q.topic].last||a.ts>map[q.topic].last)map[q.topic].last=a.ts})});return Object.values(map)}function weakness(id){let h=historyFor(id).sort((a,b)=>a.ts-b.ts);if(!h.length)return .8;let recent=h.slice(-5),r=recent.filter(x=>x.correct).length/recent.length;let consecutive=0;for(let i=h.length-1;i>=0&&h[i].correct;i--)consecutive++;let last=h[h.length-1]?.ts||0;let days=last?Math.min(14,(Date.now()-last)/86400000):14;return Math.max(.12,(1-r)*1.35+days*.025-Math.min(consecutive,4)*.08+(h.length<2?.2:0))}function pickWeighted(n,filter=()=>true){let pool=activeQs().filter(filter).map(q=>({id:q.id,w:weakness(q.id)*(q.favorite?1.1:1)})),out=[];while(pool.length&&out.length<n){let sum=pool.reduce((s,x)=>s+x.w,0),r=Math.random()*sum,chosen=0;for(let i=0;i<pool.length;i++){r-=pool[i].w;if(r<=0){chosen=i;break}}out.push(pool.splice(chosen,1)[0].id)}return out}function weakItems(limit=4){return topicStats().map(x=>({...x,r:x.t?Math.round(x.c/x.t*100):null})).sort((a,b)=>(a.r??55)-(b.r??55)||b.t-a.t).slice(0,limit)}function show(view){['home','quiz','weak','stats','manage','sort'].forEach(v=>$('#'+v+'View').classList.toggle('hidden',v!==view));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='sort')renderDrillHub();if(view==='home')renderHome();if(view==='weak')renderWeak();if(view==='stats')renderStats();if(view==='manage')renderManage();if(view==='quiz'&&!session.length)renderQuizLanding()}function renderHome(){const td=state.todayDone.date===today()?state.todayDone.count:0,ws=weakItems(3);$('#streakPill').textContent=`🔥 ${state.streak}日`;$('#homeView').innerHTML=`<section class="card hero"><small> let sortSession=null;
function sortBank(){try{const x=JSON.parse(localStorage.getItem(SORT_BANK_KEY)||'null');return x&&Array.isArray(x.questions)?x:null}catch(e){return null}}
function setSortBank(x){localStorage.setItem(SORT_BANK_KEY,JSON.stringify(x))}
function sortStats(){try{return JSON.parse(localStorage.getItem(SORT_STATS_KEY)||'{}')}catch(e){return {}}}
function setSortStats(x){localStorage.setItem(SORT_STATS_KEY,JSON.stringify(x))}
function initSortBank(){let b=sortBank();if(!b){b=JSON.parse(JSON.stringify(SORT_SEED));setSortBank(b);return b}const ids=new Set((b.questions||[]).map(q=>q.id));let changed=false;for(const q of SORT_SEED.questions){if(!ids.has(q.id)){b.questions.push(JSON.parse(JSON.stringify(q)));ids.add(q.id);changed=true}}if(changed){b.questions.sort((a,b)=>String(a.id).localeCompare(String(b.id)));b.lawBaseDate=SORT_SEED.lawBaseDate||b.lawBaseDate;b.examYear=SORT_SEED.examYear||b.examYear;setSortBank(b)}return b}
function sortSignature(q){return JSON.stringify({answer:q.answer,objectType:q.objectType,transactionType:q.transactionType,conditions:q.conditions||{}})}
function validateSortBank(data){if(!data||data.format!=='takken-3537-sort-drill-v1'||!Array.isArray(data.questions))throw new Error('35・37条仕分けドリル用のJSONではありません。');const ids=new Set();for(const q of data.questions){if(!q||typeof q.id!=='string'||!q.id.trim())throw new Error('IDのない問題があります。');if(ids.has(q.id))throw new Error(`JSON内でIDが重複しています: ${q.id}`);ids.add(q.id);if(!Object.hasOwn(SORT_LABELS,q.answer))throw new Error(`正解分類が不正です: ${q.id}`);if(!q.prompt||!q.objectType||!q.transactionType)throw new Error(`必須項目が不足しています: ${q.id}`)}return true}
function mergeSortBank(incoming){validateSortBank(incoming);const current=initSortBank(),map=new Map((current.questions||[]).map(q=>[q.id,q])),stats=sortStats();let added=0,updated=0,skippedOld=0,resetStats=0,unchanged=0;for(const q of incoming.questions){const old=map.get(q.id);if(!old){map.set(q.id,q);added++;continue}const ov=Number(old.version??1),nv=Number(q.version??1);if(nv<ov){skippedOld++;continue}if(JSON.stringify(old)===JSON.stringify(q)){unchanged++;continue}if(sortSignature(old)!==sortSignature(q)&&stats[q.id]){delete stats[q.id];resetStats++}map.set(q.id,q);updated++}current.questions=[...map.values()].sort((a,b)=>String(a.id).localeCompare(String(b.id)));current.lawBaseDate=incoming.lawBaseDate||current.lawBaseDate;current.examYear=incoming.examYear||current.examYear;current.answerLabels=incoming.answerLabels||current.answerLabels;current.sourcePolicy=incoming.sourcePolicy||current.sourcePolicy;setSortBank(current);setSortStats(stats);return{added,updated,skippedOld,resetStats,unchanged,total:current.questions.length}}
function sortQuestions(){return (initSortBank().questions||[]).filter(q=>q.active!==false)}
function sortShuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function sortStatusText(){const qs=sortQuestions(),st=sortStats(),done=qs.filter(q=>(st[q.id]?.attempts||0)>0).length,bad=qs.filter(q=>(st[q.id]?.wrong||0)>0).length;return `${qs.length}問・学習済 ${done}問・誤答あり ${bad}問`}
function sortPerformanceStats(){const qs=sortQuestions(),st=sortStats();let attempts=0,correct=0,totalMs=0;const rows=Object.entries(SORT_LABELS).map(([key,label])=>{let a=0,c=0,ms=0;for(const q of qs.filter(q=>q.answer===key)){const s=st[q.id];if(!s)continue;a+=s.attempts||0;c+=s.correct||0;ms+=s.totalMs||0}attempts+=a;correct+=c;totalMs+=ms;return{key,label,attempts:a,correct:c,rate:a?Math.round(c/a*100):0}});return{rows,attempts,correct,rate:attempts?Math.round(correct/attempts*100):0,avg:attempts?totalMs/attempts/1000:null}}
function sortStatsGraphHtml(){const x=sortPerformanceStats();return `<section class="card"><h3 style="margin-top:0">仕分け成績</h3><div class="grid"><div class="mini"><b>${x.attempts?x.rate+'%':'-'}</b><span>総合正答率</span></div><div class="mini"><b>${x.avg===null?'-':x.avg.toFixed(1)+'秒'}</b><span>平均回答時間</span></div></div>${x.rows.map(r=>`<div class="stat-row"><div class="line"><b>${r.label}</b><span>${r.attempts?`${r.correct}/${r.attempts}（${r.rate}%）`:'未回答'}</span></div><div class="bar"><i style="width:${r.rate}%"></i></div></div>`).join('')}</section>`}
function render3537Landing(){initSortBank();const v=$('#sortView');v.innerHTML=`<section class="card"><button class="smallbtn" onclick="renderDrillHub()">← ドリル一覧</button><h2 style="margin-top:14px">35条・37条 仕分けドリル</h2><p class="note">目的物と取引類型まで見て、「35条のみ・37条のみ・両方・どちらでもない」を瞬時に仕分けます。</p><div class="pill" style="display:inline-block;margin-top:6px">${sortStatusText()}</div><div class="sort-controls"><label class="note">出題モード<select id="sortMode" class="sort-select"><option value="all">全項目</option><option value="wrong">間違えた項目だけ</option></select></label><label class="note">出題数<select id="sortCount" class="sort-select"><option value="10">10問</option><option value="20">20問</option><option value="all">全問</option></select></label><label class="note">目的物<select id="sortObject" class="sort-select"><option value="all">すべて</option><option value="土地">土地</option><option value="建物">建物</option></select></label><label class="note">取引<select id="sortTransaction" class="sort-select"><option value="all">すべて</option><option value="売買・交換">売買・交換</option><option value="貸借">貸借</option></select></label></div><button class="primary" style="margin-top:12px" onclick="startSortDrill()">仕分けドリルを開始</button></section>${sortStatsGraphHtml()}<section class="card"><h3 style="margin-top:0">問題データ管理</h3><p class="note">ChatGPTで修正したJSONを読み込むと、同じIDの問題を更新します。古いversionは上書きしません。正答や取引条件が変わった問題だけ、その問題の学習統計をリセットします。</p><input id="sortImport" class="sort-file" type="file" accept="application/json,.json" onchange="importSortFile(this.files[0])"><div id="sortImportStatus" class="note" style="margin-top:8px">内蔵問題 ${sortQuestions().length}問</div><button class="secondary" style="margin-top:10px" onclick="exportSortAnalysis()">ChatGPT分析用JSONを書き出す</button><button class="secondary" style="margin-top:10px" onclick="exportSortBank()">現在の問題JSONを書き出す</button><button class="secondary danger" style="margin-top:10px" onclick="resetSortStats()">仕分け学習履歴をリセット</button><div class="sort-bank-list">${sortQuestions().map(q=>`<div class="sort-bank-row"><div><span class="sort-id">${q.id} / v${q.version??1}</span></div><b>${q.prompt}</b><div class="note">${q.objectType}・${q.transactionType} → ${SORT_LABELS[q.answer]}</div></div>`).join('')}</div></section>`}
function startSortDrill(){let qs=sortQuestions(),st=sortStats(),m=$('#sortMode').value,obj=$('#sortObject').value,tr=$('#sortTransaction').value;if(m==='wrong')qs=qs.filter(q=>(st[q.id]?.wrong||0)>0);if(obj!=='all')qs=qs.filter(q=>q.objectType===obj);if(tr!=='all')qs=qs.filter(q=>q.transactionType===tr);qs=sortShuffle(qs);const cnt=$('#sortCount').value,n=cnt==='all'?qs.length:Math.min(Number(cnt),qs.length);qs=qs.slice(0,n);if(!qs.length){$('#sortView').innerHTML=`<section class="card"><div class="empty">条件に合う問題がありません。</div><button class="secondary" onclick="render3537Landing()">条件選択に戻る</button></section>`;return}sortSession={ids:qs.map(q=>q.id),idx:0,correct:0,answered:false,answers:[],started:Date.now()};renderSortQuestion()}
function currentSortQ(){if(!sortSession)return null;const id=sortSession.ids[sortSession.idx];return sortQuestions().find(q=>q.id===id)||null}
function sortCondLabel(k,v){const m={existing:'既存建物',residential:'住宅',construction:'工事',hasProvision:'定めあり',asbestosRecord:'石綿調査記録あり',oldBuilding:'旧耐震対象',seismicRecord:'耐震診断あり',newHousing:'新築住宅',housingPerformanceEvaluation:'住宅性能評価あり'};if(v===true)return m[k]||k;if(k==='construction')return `工事：${v}`;return `${m[k]||k}：${v}`}
function renderSortQuestion(){const q=currentSortQ();if(!q){renderSortFinish();return}sortSession.answered=false;sortSession.qStarted=Date.now();const i=sortSession.idx,total=sortSession.ids.length,st=sortStats()[q.id]||{},conds=Object.entries(q.conditions||{}).filter(([,v])=>v!==false&&v!==null&&v!=='').map(([k,v])=>`<span class="sort-chip">${sortCondLabel(k,v)}</span>`).join('');$('#sortView').innerHTML=`<section class="card"><div class="quiz-head"><span>${i+1} / ${total}</span><span>${sortSession.correct}正解</span></div><div class="sort-progress"><i style="width:${Math.round(i/total*100)}%"></i></div><div class="sort-meta"><span class="sort-chip">目的物：${q.objectType}</span><span class="sort-chip">取引：${q.transactionType}</span>${conds}</div><div class="sort-question">${q.prompt}</div><div class="sort-answers">${Object.entries(SORT_LABELS).map(([v,l])=>`<button class="sort-answer" data-sort-answer="${v}" onclick="answerSort('${v}')">${l}</button>`).join('')}</div><div id="sortFeedback"></div><p class="note" style="margin-top:14px">ID ${q.id} / v${q.version??1} ・ 過去 ${st.correct||0}正解 / ${st.wrong||0}誤答</p></section>`}
function answerSort(val){if(!sortSession||sortSession.answered)return;const q=currentSortQ();sortSession.answered=true;const ok=val===q.answer,ms=Date.now()-sortSession.qStarted;if(ok)sortSession.correct++;sortSession.answers.push({id:q.id,correct:ok,ms});const all=sortStats(),s=all[q.id]||{attempts:0,correct:0,wrong:0,totalMs:0,lastAnswer:null,lastAt:null};s.attempts++;s[ok?'correct':'wrong']++;s.totalMs=(s.totalMs||0)+ms;s.lastAnswer=val;s.lastAt=new Date().toISOString();s.version=q.version??1;s.history=Array.isArray(s.history)?s.history:[];s.history.push({at:new Date().toISOString(),answer:val,correct:ok,ms});if(s.history.length>200)s.history=s.history.slice(-200);all[q.id]=s;setSortStats(all);document.querySelectorAll('.sort-answer').forEach(b=>{b.disabled=true;if(b.dataset.sortAnswer===q.answer)b.classList.add('ok');if(b.dataset.sortAnswer===val&&!ok)b.classList.add('ng');if(b.dataset.sortAnswer===val)b.classList.add('sel')});const f=$('#sortFeedback');f.className=`sort-feedback ${ok?'good':'bad'}`;f.innerHTML=`<h4 style="margin:0">${ok?'✅ 正解':'❌ 不正解'}　正解：${SORT_LABELS[q.answer]}</h4><p>${q.explanation||''}</p><div class="note">根拠：${q.legalBasis||'-'}　回答時間：${(ms/1000).toFixed(1)}秒</div><button class="primary" style="margin-top:12px" onclick="nextSortQ()">${sortSession.idx+1===sortSession.ids.length?'結果を見る':'次の問題'}</button>`}
function nextSortQ(){sortSession.idx++;if(sortSession.idx>=sortSession.ids.length)renderSortFinish();else renderSortQuestion()}
function renderSortFinish(){const total=sortSession.ids.length,c=sortSession.correct,p=Math.round(c/total*100),avg=sortSession.answers.reduce((a,x)=>a+x.ms,0)/sortSession.answers.length/1000,miss=sortSession.answers.filter(x=>!x.correct);$('#sortView').innerHTML=`<section class="card" style="text-align:center"><div style="font-size:52px">${p>=90?'🎯':p>=70?'👍':'🗂️'}</div><h2>${c} / ${total} 正解</h2><p class="note">正答率 ${p}% ・ 平均回答 ${avg.toFixed(1)}秒</p>${miss.length?`<div style="text-align:left;margin:14px 0">${miss.map(x=>{const q=sortQuestions().find(q=>q.id===x.id);return `<div class="weak"><div><div class="sort-id">${x.id}</div><div class="name">${q?.prompt||''}</div></div></div>`}).join('')}</div>`:'<p class="note">全問正解です。</p>'}<button class="primary" onclick="render3537Landing()">条件選択に戻る</button></section>`;sortSession=null}
async function importSortFile(file){if(!file)return;try{const data=JSON.parse(await file.text()),r=mergeSortBank(data);render3537Landing();const el=$('#sortImportStatus');if(el){el.textContent=`更新完了：追加 ${r.added}問 / 更新 ${r.updated}問 / 変更なし ${r.unchanged}問 / 古いversion無視 ${r.skippedOld}問 / 統計リセット ${r.resetStats}問 / 合計 ${r.total}問`;el.style.color='var(--good)'}}catch(e){const el=$('#sortImportStatus');if(el){el.textContent=`読み込み失敗：${e.message}`;el.style.color='var(--bad)'}}}
function exportSortBank(){const b=initSortBank(),blob=new Blob([JSON.stringify(b,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`takken_3537_sort_drill_${b.examYear||'bank'}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500)}
function resetSortStats(){if(confirm('35・37条仕分けドリルの学習履歴をリセットしますか？\n問題データは残ります。')){localStorage.removeItem(SORT_STATS_KEY);sortSession=null;render3537Landing()}}

function shakuStats(){try{return JSON.parse(localStorage.getItem(SHAKU_STATS_KEY)||'{}')}catch(e){return {}}}
function saveShakuStats(x){localStorage.setItem(SHAKU_STATS_KEY,JSON.stringify(x))}
let shakuSession=null;
function shakuCategoryStats(){const st=shakuStats();return SHAKU_CATS.map(cat=>{let attempts=0,correct=0;SHAKU_QUESTIONS.filter(q=>q.cat===cat).forEach(q=>{const x=st[q.id];if(x){attempts+=x.attempts||0;correct+=x.correct||0}});return{cat,attempts,correct,rate:attempts?Math.round(correct/attempts*100):0}})}
function renderSortLanding(){render3537Landing()}
function renderDrillHub(){const st=shakuStats(),sdone=SHAKU_QUESTIONS.filter(q=>(st[q.id]?.attempts||0)>0).length;$('#sortView').innerHTML=`<section class="card"><h2 style="margin-top:0">ドリル</h2><p class="note">知識を覚えるだけでなく、似た制度を条件から見分ける練習をします。</p><div class="drill-menu"><button class="drill-card" onclick="render3537Landing()"><span class="drill-tag">宅建業法</span><b>🗂️ 35条・37条</b><span>重要事項説明と契約書面を、目的物・取引条件まで見て仕分ける。</span></button><button class="drill-card" onclick="renderShakuLanding()"><span class="drill-tag">権利関係</span><b>🏠 借地借家法</b><span>制度・期間・更新・対抗要件・書面・主体を条件から判断。${SHAKU_QUESTIONS.length}問中 ${sdone}問学習済み。</span></button></div></section>`}
function renderShakuLanding(){const rows=shakuCategoryStats(),st=shakuStats(),attempts=Object.values(st).reduce((a,x)=>a+(x.attempts||0),0),correct=Object.values(st).reduce((a,x)=>a+(x.correct||0),0),rate=attempts?Math.round(correct/attempts*100):0;$('#sortView').innerHTML=`<section class="card"><button class="smallbtn" onclick="renderDrillHub()">← ドリル一覧</button><h2 style="margin-top:14px">借地借家法ドリル</h2><p class="note">○×ではなく、条件を読んで制度・数字・権利関係を選び分けます。</p><div class="grid"><div class="mini"><b>${attempts?rate+'%':'-'}</b><span>総合正答率</span></div><div class="mini"><b>${SHAKU_QUESTIONS.length}</b><span>問題数</span></div></div><div class="field"><label>出題カテゴリ</label><select id="shakuCat" class="select"><option value="all">総合ランダム</option>${SHAKU_CATS.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div><div class="field"><label>出題数</label><select id="shakuCount" class="select"><option value="10">10問</option><option value="20">20問</option><option value="all">全問</option></select></div><button class="primary" onclick="startShakuDrill()">借地借家法ドリルを開始</button></section><section class="card"><h3 style="margin-top:0">カテゴリ別成績</h3>${rows.map(r=>`<div class="stat-row"><div class="line"><b>${r.cat}</b><span>${r.attempts?`${r.correct}/${r.attempts}（${r.rate}%）`:'未回答'}</span></div><div class="bar"><i style="width:${r.rate}%"></i></div></div>`).join('')}<button class="secondary" style="margin-bottom:10px" onclick="exportShakuAnalysis()">ChatGPT分析用JSONを書き出す</button><button class="secondary danger" onclick="resetShakuStats()">借地借家法の学習履歴をリセット</button></section>`}
function startShakuDrill(){const cat=$('#shakuCat').value,cnt=$('#shakuCount').value;let qs=SHAKU_QUESTIONS.filter(q=>cat==='all'||q.cat===cat).sort(()=>Math.random()-.5);if(cnt!=='all')qs=qs.slice(0,Math.min(Number(cnt),qs.length));shakuSession={ids:qs.map(q=>q.id),idx:0,correct:0,answers:[]};renderShakuQuestion()}

function renderShakuQuestion(){const q=currentShakuQ();if(!q){renderShakuFinish();return}const st=shakuStats()[q.id]||{};shakuSession.started=Date.now();$('#sortView').innerHTML=`<section class="card"><div class="quiz-head"><span>${shakuSession.idx+1} / ${shakuSession.ids.length}</span><span>${shakuSession.correct}正解</span></div><div class="sort-progress"><i style="width:${Math.round(shakuSession.idx/shakuSession.ids.length*100)}%"></i></div><div style="margin-top:14px"><span class="shaku-category">${q.cat}</span></div><div class="sort-question">${q.prompt}</div><div class="shaku-options">${q.options.map((o,i)=>`<button class="shaku-option" data-shaku-answer="${i}" onclick="answerShaku(${i})">${i+1}. ${o}</button>`).join('')}</div><div id="shakuFeedback"></div><p class="note" style="margin-top:14px">ID ${q.id} ・ 過去 ${st.correct||0}正解 / ${st.wrong||0}誤答</p></section>`}
function answerShaku(v){if(!shakuSession||shakuSession.answered)return;shakuSession.answered=true;const q=currentShakuQ(),ok=v===q.answer,ms=Date.now()-shakuSession.started;if(ok)shakuSession.correct++;shakuSession.answers.push({id:q.id,correct:ok,ms});const all=shakuStats(),x=all[q.id]||{attempts:0,correct:0,wrong:0,totalMs:0};x.attempts++;x[ok?'correct':'wrong']++;x.totalMs=(x.totalMs||0)+ms;x.lastAnswer=v;x.lastAt=new Date().toISOString();x.history=Array.isArray(x.history)?x.history:[];x.history.push({at:x.lastAt,answer:v,correct:ok,ms});if(x.history.length>200)x.history=x.history.slice(-200);all[q.id]=x;saveShakuStats(all);document.querySelectorAll('.shaku-option').forEach(b=>{b.disabled=true;const n=Number(b.dataset.shakuAnswer);if(n===q.answer)b.classList.add('ok');if(n===v&&!ok)b.classList.add('ng');if(n===v)b.classList.add('sel')});$('#shakuFeedback').innerHTML=`<div class="sort-feedback ${ok?'good':'bad'}"><h4 style="margin:0">${ok?'✅ 正解':'❌ 不正解'}　正解：${q.options[q.answer]}</h4><p>${q.exp}</p><div class="note">根拠：${q.basis} ・ ${(ms/1000).toFixed(1)}秒</div><button class="primary" style="margin-top:12px" onclick="nextShakuQ()">${shakuSession.idx+1===shakuSession.ids.length?'結果を見る':'次の問題'}</button></div>`}
function nextShakuQ(){shakuSession.idx++;shakuSession.answered=false;if(shakuSession.idx>=shakuSession.ids.length)renderShakuFinish();else renderShakuQuestion()}
function renderShakuFinish(){const total=shakuSession.ids.length,c=shakuSession.correct,p=Math.round(c/total*100),avg=shakuSession.answers.reduce((a,x)=>a+x.ms,0)/Math.max(1,shakuSession.answers.length)/1000;$('#sortView').innerHTML=`<section class="card" style="text-align:center"><div style="font-size:52px">${p>=90?'🎯':p>=70?'👍':'🏠'}</div><h2>${c} / ${total} 正解</h2><p class="note">正答率 ${p}% ・ 平均回答 ${avg.toFixed(1)}秒</p><button class="primary" onclick="renderShakuLanding()">借地借家法の成績へ</button><button class="secondary" style="margin-top:8px" onclick="renderDrillHub()">ドリル一覧へ</button></section>`;shakuSession=null}

function renderManage(){let list=filteredQuestions(),active=state.questions.filter(q=>q.active!==false).length,unv=state.questions.filter(q=>!q.verified).length;$('#manageView').innerHTML=`<section class="card"><h2 style="margin-top:0">問題管理</h2><div class="countbox"><div><b>${state.questions.length}</b><span>登録</span></div><div><b>${active}</b><span>出題中</span></div><div><b>${unv}</b><span>未確認</span></div></div><div class="toolbar"><button class="smallbtn primaryish" onclick="openEditor()">＋ 1問追加</button><button class="smallbtn" onclick="openImport()">📥 一括インポート</button></div></section><section class="card"><div class="field"><input class="input" placeholder="問題文・テーマを検索" value="${esc(manageFilter.q)}" oninput="manageFilter.q=this.value;renderManage()"></div><div class="form-grid"><select class="select" onchange="manageFilter.cat=this.value;renderManage()"><option value="all">全分野</option>${['権利関係','宅建業法','法令上の制限','税・その他'].map(c=>`<option ${manageFilter.cat===c?'selected':''}>${c}</option>`).join('')}</select><select class="select" onchange="manageFilter.status=this.value;renderManage()"><option value="all">全状態</option><option value="active" ${manageFilter.status==='active'?'selected':''}>出題中</option><option value="inactive" ${manageFilter.status==='inactive'?'selected':''}>出題対象外</option><option value="unverified" ${manageFilter.status==='unverified'?'selected':''}>未確認</option><option value="favorite" ${manageFilter.status==='favorite'?'selected':''}>お気に入り</option></select></div><p class="note">${list.length}問表示</p>${list.map(q=>problemCard(q)).join('')||'<div class="empty">条件に一致する問題がありません。</div>'}</section>`}function problemCard(q){return`<div class="problem ${q.active===false?'inactive':''}"><div class="problem-top"><div><div class="problem-title">${esc(q.q)}</div><div class="problem-meta"><span class="chip">${esc(q.cat)}</span><span class="chip">${esc(q.topic)}</span><span class="chip">難易度${esc(q.diff)}</span><span class="chip ${q.source==='ChatGPT生成'?'ai':''}">${esc(q.source||'自作')}</span><span class="chip ${q.verified?'okay':''}">${q.verified?'確認済み':'未確認'}</span>${q.active===false?'<span class="chip off">出題OFF</span>':''}</div></div><button class="iconbtn ${q.favorite?'fav':''}" onclick="toggleFavorite('${q.id}')">${q.favorite?'★':'☆'}</button></div><div class="toolbar" style="margin-top:10px"><button class="smallbtn" onclick="openEditor('${q.id}')">編集</button><button class="smallbtn" onclick="cloneQuestion('${q.id}')">複製</button><button class="smallbtn" onclick="toggleActive('${q.id}')">${q.active===false?'出題ON':'出題OFF'}</button></div></div>`}function openEditor(id=null){let q=id?getQ(id):{cat:'権利関係',topic:'',diff:'A',q:'',a:true,exp:'',source:'自作',verified:true,active:true,favorite:false};$('#modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><h2>${id?'問題を編集':'問題を追加'}</h2><div class="field"><label>問題文</label><textarea id="edQ" class="textarea">${esc(q.q)}</textarea></div><div class="form-grid"><div class="field"><label>正解</label><select id="edA" class="select"><option value="true" ${q.a?'selected':''}>○</option><option value="false" ${!q.a?'selected':''}>×</option></select></div><div class="field"><label>難易度</label><select id="edD" class="select">${['A','B','C','D'].map(x=>`<option ${q.diff===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="form-grid"><div class="field"><label>分野</label><select id="edC" class="select">${['権利関係','宅建業法','法令上の制限','税・その他'].map(x=>`<option ${q.cat===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>テーマ</label><input id="edT" class="input" value="${esc(q.topic)}"></div></div><div class="field"><label>解説</label><textarea id="edE" class="textarea">${esc(q.exp)}</textarea></div><div class="form-grid"><div class="field"><label>出典</label><select id="edS" class="select">${['自作','ChatGPT生成','過去問類題','初期問題'].map(x=>`<option ${q.source===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>状態</label><select id="edV" class="select"><option value="true" ${q.verified?'selected':''}>確認済み</option><option value="false" ${!q.verified?'selected':''}>未確認</option></select></div></div><label class="toggle"><input id="edOn" type="checkbox" ${q.active!==false?'checked':''}> 出題対象にする</label>${id?`<button class="smallbtn dangerish" style="width:100%;margin-top:16px" onclick="deleteQuestion('${q.id}')">この問題を削除</button>`:''}<div class="modal-actions"><button class="secondary" onclick="closeModal()">キャンセル</button><button class="primary" onclick="saveEditor('${id||''}')">保存</button></div></div></div>`}function saveEditor(id){let data={q:$('#edQ').value.trim(),a:$('#edA').value==='true',diff:$('#edD').value,cat:$('#edC').value,topic:$('#edT').value.trim(),exp:$('#edE').value.trim(),source:$('#edS').value,verified:$('#edV').value==='true',active:$('#edOn').checked};if(!data.q||!data.topic||!data.exp){alert('問題文・テーマ・解説を入力してください。');return}let dup=state.questions.find(x=>x.id!==id&&norm(x.q)===norm(data.q));if(dup&&!confirm('同じ問題文の問題が既にあります。それでも保存しますか？'))return;if(id){Object.assign(getQ(id),data)}else state.questions.unshift({...data,id:uid(),favorite:false,createdAt:today()});save();closeModal();renderManage()}function cloneQuestion(id){let q=getQ(id);state.questions.unshift({...q,id:uid(),q:q.q+'（複製）',source:'自作',verified:false,createdAt:today()});save();renderManage();openEditor(state.questions[0].id)}function deleteQuestion(id){if(!confirm('この問題を削除しますか？ 学習履歴も削除されます。'))return;state.questions=state.questions.filter(q=>q.id!==id);state.answers=state.answers.filter(a=>a.qid!==id);save();closeModal();renderManage()}function toggleActive(id){let q=getQ(id);q.active=q.active===false?true:false;save();renderManage()}function toggleFavorite(id,rerenderQuiz=false){let q=getQ(id);q.favorite=!q.favorite;save();if(rerenderQuiz)renderQuestion();else renderManage()}function closeModal(){$('#modalRoot').innerHTML=''}function openImport(){$('#modalRoot').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><h2>ChatGPT問題をインポート</h2><p class="note">JSONファイルを選ぶか、ChatGPTから受け取ったJSONを貼り付けてください。Base64は使いません。</p><input id="fileImport" class="input" type="file" accept="application/json,.json" onchange="readImportFile(this.files[0])"><div class="field"><label>またはJSONを貼り付け</label><textarea id="importText" class="textarea" style="min-height:180px" placeholder='[{"question":"...","answer":true,"explanation":"...","category":"権利関係","topic":"時効","difficulty":"B"}]'></textarea></div><div id="importInfo"></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">閉じる</button><button class="primary" onclick="previewImport()">内容を確認</button></div></div></div>`}function readImportFile(file){if(!file)return;let r=new FileReader();r.onload=()=>{$('#importText').value=r.result;previewImport()};r.readAsText(file,'UTF-8')}function normalizeImported(x){return{id:uid(),q:String(x.q??x.question??'').trim(),a:typeof(x.a??x.answer)==='boolean'?(x.a??x.answer):String(x.a??x.answer).toLowerCase()==='true'||String(x.a??x.answer)==='○',exp:String(x.exp??x.explanation??'').trim(),cat:String(x.cat??x.category??'').trim(),topic:String(x.topic??x.theme??'').trim(),diff:String(x.diff??x.difficulty??'B').trim().toUpperCase(),source:String(x.source??'ChatGPT生成'),verified:Boolean(x.verified??false),active:x.active!==false,favorite:Boolean(x.favorite??false),createdAt:today()}}function parseImport(){try{let raw=JSON.parse($('#importText').value);if(raw.questions)raw=raw.questions;if(!Array.isArray(raw))throw new Error('配列形式ではありません');return raw.map(normalizeImported).filter(x=>x.q&&x.exp&&x.topic&&['権利関係','宅建業法','法令上の制限','税・その他'].includes(x.cat)&&['A','B','C','D'].includes(x.diff))}catch(e){alert('JSONを読み込めませんでした：'+e.message);return null}}function previewImport(){let items=parseImport();if(!items)return;let existing=new Set(state.questions.map(q=>norm(q.q))),seen=new Set(),dups=0;items.forEach(x=>{let n=norm(x.q);if(existing.has(n)||seen.has(n))dups++;seen.add(n)});let by={};items.forEach(x=>by[x.cat]=(by[x.cat]||0)+1);$('#importInfo').innerHTML=`<div class="import-summary"><b>${items.length}問を読み込み可能</b><br>${Object.entries(by).map(([k,v])=>`${k}：${v}問`).join('<br>')}<br>${dups?`⚠️ 重複候補：${dups}問`:'重複候補なし'}</div><button class="primary" style="margin-top:10px" onclick="commitImport()">重複を除いて追加</button>`}function commitImport(){let items=parseImport();if(!items)return;let existing=new Set(state.questions.map(q=>norm(q.q))),added=[];for(let x of items){let n=norm(x.q);if(existing.has(n))continue;existing.add(n);added.push(x)}state.questions=[...added,...state.questions];save();alert(`${added.length}問を追加しました。`);closeModal();renderManage()}function downloadJSON(obj,name){let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function pct(c,t){return t?Math.round(c/t*100):0}
function exportQuizAnalysis(){
  const qs=state.questions||[],ans=state.answers||[],active=qs.filter(q=>q.active!==false),qmap=new Map(qs.map(q=>[q.id,q]));
  const group=(keyFn)=>{const m={};for(const a of ans){const q=qmap.get(a.qid);if(!q)continue;const k=keyFn(q,a);if(!k)continue;if(!m[k])m[k]={attempts:0,correct:0};m[k].attempts++;if(a.correct)m[k].correct++}return Object.fromEntries(Object.entries(m).map(([k,v])=>[k,{...v,wrong:v.attempts-v.correct,accuracy:pct(v.correct,v.attempts)}]))};
  const daily={};for(const a of ans){const d=a.date||new Date(a.ts||Date.now()).toLocaleDateString('sv-SE');if(!daily[d])daily[d]={attempts:0,correct:0};daily[d].attempts++;if(a.correct)daily[d].correct++}for(const v of Object.values(daily)){v.wrong=v.attempts-v.correct;v.accuracy=pct(v.correct,v.attempts)}
  const perQuestion=qs.map(q=>{const h=ans.filter(a=>a.qid===q.id).sort((a,b)=>(a.ts||0)-(b.ts||0)),c=h.filter(a=>a.correct).length,recent=h.slice(-5),rc=recent.filter(a=>a.correct).length;let streak=0;for(let i=h.length-1;i>=0&&h[i].correct;i--)streak++;return{id:q.id,category:q.cat,topic:q.topic,difficulty:q.diff,active:q.active!==false,favorite:!!q.favorite,question:q.q,attempts:h.length,correct:c,wrong:h.length-c,accuracy:pct(c,h.length),recent5Accuracy:pct(rc,recent.length),currentCorrectStreak:streak,lastAnsweredAt:h.length?(h[h.length-1].ts||null):null}}).filter(x=>x.attempts>0);
  const data={format:'takken-chatgpt-analysis-quiz-v1',exportedAt:new Date().toISOString(),source:'通常一問一答',responseTimeAvailable:false,summary:{registeredQuestions:qs.length,activeQuestions:active.length,totalAttempts:ans.length,correct:ans.filter(a=>a.correct).length,wrong:ans.filter(a=>!a.correct).length,accuracy:pct(ans.filter(a=>a.correct).length,ans.length),streak:state.streak||0,lastStudy:state.lastStudy||null},byCategory:group(q=>q.cat),byTopic:group(q=>q.topic),byDifficulty:group(q=>q.diff),daily,mistakeReasons:state.mistakeReasons||{},perQuestion,history:ans.map(a=>({qid:a.qid,correct:!!a.correct,date:a.date||null,ts:a.ts||null}))};
  downloadJSON(data,`takken-analysis-quiz-${today()}.json`)
}
function exportSortAnalysis(){
  const qs=sortQuestions(),st=sortStats(),perf=sortPerformanceStats();
  const perQuestion=qs.map(q=>{const x=st[q.id]||{},a=x.attempts||0,c=x.correct||0;return{id:q.id,objectType:q.objectType,transactionType:q.transactionType,conditions:q.conditions||{},prompt:q.prompt,correctClass:q.answer,correctLabel:SORT_LABELS[q.answer],attempts:a,correct:c,wrong:x.wrong||0,accuracy:pct(c,a),averageSeconds:a?Math.round(((x.totalMs||0)/a)/100)/10:null,lastAnswer:x.lastAnswer||null,lastAt:x.lastAt||null,history:Array.isArray(x.history)?x.history:[]}});
  const data={format:'takken-chatgpt-analysis-3537-v1',exportedAt:new Date().toISOString(),source:'35条・37条仕分けドリル',lawBaseDate:initSortBank().lawBaseDate||null,summary:{questionCount:qs.length,totalAttempts:perf.attempts,correct:perf.correct,wrong:perf.attempts-perf.correct,accuracy:perf.rate,averageSeconds:perf.avg===null?null:Math.round(perf.avg*10)/10},byClassification:perf.rows.map(r=>({...r,wrong:r.attempts-r.correct})),perQuestion};
  downloadJSON(data,`takken-analysis-3537-${today()}.json`)
}
function exportShakuAnalysis(){
  const st=shakuStats(),cats=shakuCategoryStats(),attempts=Object.values(st).reduce((a,x)=>a+(x.attempts||0),0),correct=Object.values(st).reduce((a,x)=>a+(x.correct||0),0),totalMs=Object.values(st).reduce((a,x)=>a+(x.totalMs||0),0);
  const perQuestion=SHAKU_QUESTIONS.map(q=>{const x=st[q.id]||{},a=x.attempts||0,c=x.correct||0;return{id:q.id,category:q.cat,prompt:q.prompt,options:q.options,correctAnswerIndex:q.answer,correctAnswer:q.options[q.answer],basis:q.basis,attempts:a,correct:c,wrong:x.wrong||0,accuracy:pct(c,a),averageSeconds:a?Math.round(((x.totalMs||0)/a)/100)/10:null,lastAnswerIndex:Number.isInteger(x.lastAnswer)?x.lastAnswer:null,lastAnswer:Number.isInteger(x.lastAnswer)?q.options[x.lastAnswer]:null,lastAt:x.lastAt||null,history:Array.isArray(x.history)?x.history:[]}});
  const data={format:'takken-chatgpt-analysis-shakuchi-shakka-v1',exportedAt:new Date().toISOString(),source:'借地借家法ドリル',summary:{questionCount:SHAKU_QUESTIONS.length,totalAttempts:attempts,correct,wrong:attempts-correct,accuracy:pct(correct,attempts),averageSeconds:attempts?Math.round((totalMs/attempts)/100)/10:null},byCategory:cats.map(x=>({...x,wrong:x.attempts-x.correct})),perQuestion};
  downloadJSON(data,`takken-analysis-shakuchi-shakka-${today()}.json`)
}
function exportQuestions(){downloadJSON({format:'takken-question-bank-v1',exportedAt:new Date().toISOString(),questions:state.questions},`takken-questions-${today()}.json`)}function exportBackup(){downloadJSON({...state,format:'takken-full-backup-v2',exportedAt:new Date().toISOString()},`takken-backup-${today()}.json`)}function resetData(){if(confirm('学習履歴とミス理由だけをリセットしますか？ 問題バンクは残ります。')){state.answers=[];state.streak=0;state.lastStudy=null;state.todayDone={date:'',count:0};state.mistakeReasons={};save();renderHome();renderStats()}}document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.view)));renderHome();
</script>
